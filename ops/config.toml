# Orchestrator config. Paths are relative to the main checkout.
# Placeholders: {root} = main checkout, {state} = ops/state, {data} = data/

[defaults]
claude_bin = "auto"            # or a list, e.g. ["python", "path/to/stub.py"] for testing
permission_mode = "acceptEdits"
max_turns = 60
budget_usd = 5.0               # per session; notional on a Max plan, still caps a runaway session
session_wall_min = 45          # hard wall-clock kill per session
eval_timeout_min = 15
max_consecutive_failures = 3   # real failures only; usage limits never count
max_planner_refills = 3        # per night, so scope can't creep while you sleep
ratelimit_backoff_min = [10, 20, 40, 60]
ratelimit_reset_margin_sec = 60

[planner]
model = "opus"
fallback_model = "sonnet"
budget_usd = 3.0
max_turns = 30

# Score-gated loop: one task per fresh session, kept only if the frozen eval doesn't regress.
[divisions.core]
pattern = "climb"
branch = "div/core"
worktree = ".claude/worktrees/core"
model = "sonnet"
fallback_model = "opus"
eval = "eval/core.py"
direction = "max"              # "min" if lower headline is better
tolerance = 0.0                # 0 = use the stdev the eval reports
max_attempts_per_task = 2

# Run-and-repair loop: the pipeline runs on its own (and owns the GPU overnight);
# Claude is called only on crash, hang, or failed validation.
[divisions.swarm]
pattern = "tend"
branch = "div/swarm"
worktree = ".claude/worktrees/swarm"
model = "sonnet"
fallback_model = "opus"
run = ["python", "-m", "swarm.run", "--resume", "--out", "{data}/swarm"]
smoke = ["python", "-m", "swarm.run", "--smoke", "--out", "{state}/swarm/smoke"]
smoke_timeout_min = 5
progress = "{data}/swarm/progress.json"
log = "{state}/swarm/pipeline.log"
validate = "eval/swarm.py"
check_every_min = 20
stale_after_min = 15
validate_every_checks = 3
min_valid_pct = 95.0

# Daytime only: no overnight loop. Has a worktree so its work stays off main until reviewed.
[divisions.analysis]
pattern = "day"
branch = "div/analysis"
worktree = ".claude/worktrees/analysis"
